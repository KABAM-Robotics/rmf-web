events {}

http {
    server {
        listen 80;
        server_name 100.83.243.60; # Replace with your public IP

        return 301 https://$host$request_uri; # Redirect all HTTP to HTTPS
    }

    server {
        listen 443 ssl;
        server_name 100.83.243.60; # Replace with your public IP

        ssl_certificate /etc/nginx/ssl/cert.pem; # Replace with your cert path
        ssl_certificate_key /etc/nginx/ssl/key.pem; # Replace with your key path

        location / {
            proxy_pass http://localhost:5173/; # Main web app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /server/ {
            proxy_pass http://localhost:8000/; # API server
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /resources/1lp77/ {
            proxy_pass https://localhost:8443/resources/1lp77/; # Keycloak resources
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /resources/master/ {
            proxy_pass https://localhost:8443/resources/master/; # Keycloak resources
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /trajectoryws {
            proxy_pass http://localhost:8006; # Trajectory server
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}