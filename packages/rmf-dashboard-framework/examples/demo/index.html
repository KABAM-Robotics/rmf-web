<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Web application that provides overall visualization and control over the RMF system"
    />
    <link rel="shortcut icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <title>RMF Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Replaced at container start by docker/dashboard/inject-env.sh; left as-is
         (and ignored by main.tsx) when served by the Vite dev server. -->
    <script>
      window.__RMF_DASHBOARD_CONFIG__ = {
        rmfServerUrl: '__RMF_SERVER_URL__',
        trajectoryServerUrl: '__TRAJECTORY_SERVER_URL__',
        // optional: rewrite map image URLs for sites behind a TLS proxy,
        // e.g. from 'http://10.0.0.5:8000' to 'https://hotel.example/server'
        mapImageUrlFrom: '__MAP_IMAGE_URL_FROM__',
        mapImageUrlTo: '__MAP_IMAGE_URL_TO__',
      };
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
